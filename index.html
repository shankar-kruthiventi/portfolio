<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sankara Rao Kruthiventi · Senior Full-Stack Engineer</title>
    <meta
      name="description"
      content="Senior full-stack engineer connecting interfaces, services, platforms, quality, and AI into dependable product outcomes."
    />
    <script>
      // Apply the theme before first paint to avoid a flash. Mirrors src/hooks/useTheme.ts.
      ;(function () {
        // Dark is the default; a choice saved by the toggle wins.
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('theme')
          if (saved === 'light' || saved === 'dark') theme = saved
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
